  padding: 0;

}

  corner-shape: var(--corner-shape);

&lt;script&gt;
(function(){
  &quot;use strict&quot;;
  const root=document.getElementById(&quot;wb-desktop-journeys&quot;);

  const sidebar=document.getElementById(&quot;wb-sidebar&quot;);

  const journeyIds=[&quot;dictate&quot;,&quot;meetings&quot;,&quot;read&quot;,&quot;snap&quot;,&quot;snaptalk&quot;,&quot;draw&quot;,&quot;present&quot;,&quot;persona&quot;];

  const labels={home:&quot;Home&quot;,dictate:&quot;Dictate&quot;,dictionary:&quot;Dictionary&quot;,meetings:&quot;Meetings&quot;,read:&quot;Read&quot;,snap:&quot;Snap&quot;,snaptalk:&quot;Snap &amp; Talk&quot;,draw:&quot;Draw&quot;,present:&quot;Present&quot;,persona:&quot;Persona&quot;,history:&quot;History&quot;,library:&quot;Library&quot;,settings:&quot;Settings&quot;};
  const icons={dictate:&quot;mic&quot;,meetings:&quot;video&quot;,read:&quot;headphones&quot;,snap:&quot;camera&quot;,snaptalk:&quot;message-square&quot;,draw:&quot;pencil&quot;,present:&quot;monitor&quot;,persona:&quot;user-round&quot;,timer:&quot;timer&quot;};
  const sampleDictation=&quot;Let&#x27;s keep the first release focused. Make the main action easy to find, put the details within reach, and keep every result in one place.&quot;;
  const sampleRead=&quot;A good workspace makes the next step clear. Start with one job, keep the useful controls close, and return to your work without losing your place.&quot;;
  const sampleTranscript=&quot;Let&#x27;s begin with the decisions we need to make today. The first is the desktop flow, from starting a job to finding its result.\n\nThe next step is to review the meeting transcript and keep the recording available if anything needs attention.\n\nWe&#x27;ll try the complete journey before we call it finished.&quot;;
  const seedHistory=[
    {id:&quot;sample-meeting&quot;,kind:&quot;meetings&quot;,title:&quot;Product check-in&quot;,meta:&quot;14 min · Today, 9:32&quot;,text:sampleTranscript,status:&quot;finished&quot;},

    {id:&quot;sample-outline&quot;,kind:&quot;dictate&quot;,title:&quot;Project outline&quot;,meta:&quot;28 words · Yesterday, 11:20&quot;,text:&quot;The next step is to review the complete desktop journey, then try it with a small example.&quot;,status:&quot;finished&quot;}
  ];
  function defaults(){return{
    version:2,page:&quot;home&quot;,sheet:null,scenario:&quot;home&quot;,selectedHistory:null,selectedAsset:&quot;mint&quot;,presentAsset:&quot;mint&quot;,personaAsset:&quot;persona&quot;,resultOverrides:{},retained:{},

    drafts:{dictate:&quot;&quot;,read:sampleRead,snaptalk:&quot;&quot;},settings:{delivery:&quot;Paste automatically&quot;,style:&quot;Natural&quot;,activation:&quot;Toggle&quot;,voice:&quot;System voice&quot;,pace:&quot;1×&quot;},dictionaryDraft:{heard:&quot;&quot;,written:&quot;&quot;},dictionaryRules:[{heard:&quot;work bench&quot;,written:&quot;Workbench&quot;}],readingPending:null,readingNotice:&quot;&quot;,readingSaveName:&quot;Reading.m4a&quot;,readingSampleSaveCount:0,
    meetingApp:&quot;Zoom&quot;,includeMic:true,microphone:&quot;Built-in microphone&quot;,capture:&quot;Region&quot;,display:&quot;Built-in display&quot;,pen:&quot;Pen&quot;,
    timer:{state:&quot;prepare&quot;,minutes:&quot;10&quot;},runs:{dictate:1,meetings:1,snap:1,snaptalk:1},

    strokes:[],recordingPlaying:false,collapsed:false,roomy:false
  }}
  function restore(snapshot){
    const fresh=defaults();const incoming=snapshot&amp;&amp;snapshot.privateContent;
    if(!incoming||incoming.version!==2)return fresh;
    [&quot;page&quot;,&quot;scenario&quot;,&quot;selectedHistory&quot;,&quot;selectedAsset&quot;,&quot;presentAsset&quot;,&quot;personaAsset&quot;,&quot;meetingApp&quot;,&quot;microphone&quot;,&quot;capture&quot;,&quot;display&quot;,&quot;pen&quot;,&quot;readingNotice&quot;,&quot;readingSaveName&quot;].forEach(function(k){if(typeof incoming[k]===&quot;string&quot;||incoming[k]===null)fresh[k]=incoming[k]});
    if(!labels[fresh.page])fresh.page=&quot;home&quot;;
    [&quot;journeys&quot;,&quot;drafts&quot;,&quot;settings&quot;,&quot;timer&quot;,&quot;runs&quot;,&quot;resultOverrides&quot;,&quot;retained&quot;,&quot;dictionaryDraft&quot;].forEach(function(k){if(incoming[k]&amp;&amp;typeof incoming[k]===&quot;object&quot;)Object.assign(fresh[k],incoming[k])});
    [&quot;history&quot;,&quot;assets&quot;,&quot;strokes&quot;,&quot;dictionaryRules&quot;].forEach(function(k){if(Array.isArray(incoming[k]))fresh[k]=incoming[k]});
    fresh.history=fresh.history.filter(function(item){return item.status===&quot;finished&quot;});
    if(incoming.readingPending&amp;&amp;typeof incoming.readingPending.text===&quot;string&quot;&amp;&amp;typeof incoming.readingPending.origin===&quot;string&quot;)fresh.readingPending=incoming.readingPending;
    if(Number.isInteger(incoming.readingSampleSaveCount))fresh.readingSampleSaveCount=incoming.readingSampleSaveCount;
    fresh.collapsed=Boolean(incoming.collapsed);fresh.roomy=Boolean(incoming.roomy);
    if(typeof incoming.includeMic===&quot;boolean&quot;)fresh.includeMic=incoming.includeMic;
    fresh.sheet=null;return fresh;
  }
  let state=restore(window.openai&amp;&amp;window.openai.widgetState);
  let lastPublishedState=&quot;&quot;;
  const design={collapsed:state.collapsed,roomy:state.roomy};
  function esc(value){return String(value==null?&quot;&quot;:value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,function(c){return{&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;&lt;&quot;:&quot;&amp;lt;&quot;,&quot;&gt;&quot;:&quot;&amp;gt;&quot;,&#x27;&quot;&#x27;:&quot;&amp;quot;&quot;,&quot;&#x27;&quot;:&quot;&amp;#39;&quot;}[c]})}
  const glyphs={house:&quot;⌂&quot;,mic:&quot;♩&quot;,video:&quot;▣&quot;,headphones:&quot;♫&quot;,camera:&quot;▣&quot;,&quot;message-square&quot;:&quot;▤&quot;,pencil:&quot;✎&quot;,monitor:&quot;▱&quot;,&quot;user-round&quot;:&quot;♙&quot;,history:&quot;◷&quot;,images:&quot;▧&quot;,&quot;settings-2&quot;:&quot;⚙&quot;,&quot;sliders-horizontal&quot;:&quot;☷&quot;,timer:&quot;◴&quot;,play:&quot;▷&quot;,pause:&quot;Ⅱ&quot;,square:&quot;□&quot;,check:&quot;✓&quot;,x:&quot;×&quot;,plus:&quot;+&quot;,&quot;arrow-left&quot;:&quot;←&quot;,&quot;arrow-up-right&quot;:&quot;↗&quot;,&quot;chevron-right&quot;:&quot;›&quot;,&quot;rotate-ccw&quot;:&quot;↻&quot;,copy:&quot;▱&quot;,ellipsis:&quot;···&quot;,&quot;folder-open&quot;:&quot;▱&quot;,&quot;triangle-alert&quot;:&quot;△&quot;,keyboard:&quot;⌨&quot;,share:&quot;↑&quot;,&quot;file-text&quot;:&quot;▤&quot;,&quot;audio-lines&quot;:&quot;≋&quot;,&quot;shield-check&quot;:&quot;◇&quot;,&quot;sun-moon&quot;:&quot;◐&quot;,&quot;undo-2&quot;:&quot;↶&quot;,&quot;loader-circle&quot;:&quot;◌&quot;};
  function icon(name){return &#x27;&lt;i data-lucide=&quot;&#x27;+name+&#x27;&quot; aria-hidden=&quot;true&quot;&gt;&#x27;+(glyphs[name]||&quot;◫&quot;)+&quot;&lt;/i&gt;&quot;}
  function btn(label,action,param,kind,iconName,disabled){return &#x27;&lt;button type=&quot;button&quot; class=&quot;wb-btn cursor-interaction &#x27;+(kind||&quot;&quot;)+&#x27;&quot; data-action=&quot;&#x27;+action+&#x27;&quot;&#x27;+(param?&#x27; data-value=&quot;&#x27;+esc(param)+&#x27;&quot;&#x27;:&quot;&quot;)+(disabled?&quot; disabled&quot;:&quot;&quot;)+&#x27;&gt;&#x27;+(iconName?icon(iconName):&quot;&quot;)+esc(label)+&quot;&lt;/button&gt;&quot;}
  function row(title,subtitle,action,param,iconName,tail,extra){return &#x27;&lt;button type=&quot;button&quot; class=&quot;wb-row cursor-interaction &#x27;+(extra||&quot;&quot;)+&#x27;&quot; data-action=&quot;&#x27;+action+&#x27;&quot; data-value=&quot;&#x27;+esc(param||&quot;&quot;)+&#x27;&quot;&gt;&lt;span class=&quot;wb-row-icon&quot;&gt;&#x27;+icon(iconName||&quot;chevron-right&quot;)+&#x27;&lt;/span&gt;&lt;span class=&quot;wb-row-copy&quot;&gt;&lt;strong&gt;&#x27;+esc(title)+&#x27;&lt;/strong&gt;&#x27;+(subtitle?&quot;&lt;small&gt;&quot;+esc(subtitle)+&quot;&lt;/small&gt;&quot;:&quot;&quot;)+&#x27;&lt;/span&gt;&lt;span class=&quot;wb-row-tail&quot;&gt;&#x27;+(tail?esc(tail):icon(&quot;chevron-right&quot;))+&quot;&lt;/span&gt;&lt;/button&gt;&quot;}
  function field(label,key,value,options,scope){return &#x27;&lt;label class=&quot;wb-field&quot;&gt;&lt;span&gt;&#x27;+esc(label)+&#x27;&lt;/span&gt;&lt;select data-field=&quot;&#x27;+key+&#x27;&quot; data-scope=&quot;&#x27;+(scope||&quot;root&quot;)+&#x27;&quot;&gt;&#x27;+options.map(function(o){return&#x27;&lt;option&#x27;+(o===value?&quot; selected&quot;:&quot;&quot;)+&#x27;&gt;&#x27;+esc(o)+&quot;&lt;/option&gt;&quot;}).join(&quot;&quot;)+&quot;&lt;/select&gt;&lt;/label&gt;&quot;}
  function header(title,subtitle,actions){return &#x27;&lt;div class=&quot;wb-page-header&quot;&gt;&lt;div&gt;&lt;h1&gt;&#x27;+esc(title)+&#x27;&lt;/h1&gt;&#x27;+(subtitle?&quot;&lt;p&gt;&quot;+esc(subtitle)+&quot;&lt;/p&gt;&quot;:&quot;&quot;)+&#x27;&lt;/div&gt;&#x27;+(actions?&#x27;&lt;div class=&quot;wb-header-actions&quot;&gt;&#x27;+actions+&quot;&lt;/div&gt;&quot;:&quot;&quot;)+&quot;&lt;/div&gt;&quot;}
  function status(text){return&#x27;&lt;span class=&quot;wb-state-line&quot;&gt;&lt;span class=&quot;wb-state-dot&quot;&gt;&lt;/span&gt;&#x27;+esc(text)+&quot;&lt;/span&gt;&quot;}
  function wave(){return&#x27;&lt;div class=&quot;wb-wave&quot; aria-label=&quot;Sample audio level&quot;&gt;&#x27;+[10,17,25,14,31,37,24,16,29,38,21,15,30,36,20,12,24,33,19,10].map(function(n){return&#x27;&lt;span style=&quot;height:&#x27;+n+&#x27;px&quot;&gt;&lt;/span&gt;&#x27;}).join(&quot;&quot;)+&quot;&lt;/div&gt;&quot;}
  function screen(selected,draw){return&#x27;&lt;div class=&quot;wb-sample-screen&#x27;+(draw?&quot; wb-drawing-board&quot;:&quot;&quot;)+&#x27;&quot;&gt;&lt;div class=&quot;wb-sample-document&#x27;+(selected?&quot; wb-selection&quot;:&quot;&quot;)+&#x27;&quot;&gt;&lt;span class=&quot;wb-secondary&quot;&gt;Project notes&lt;/span&gt;&lt;h3&gt;Make the next step clear.&lt;/h3&gt;&lt;p&gt;One workspace. One primary action.&lt;/p&gt;&lt;div class=&quot;wb-sample-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wb-sample-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wb-sample-line&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+(draw?&#x27;&lt;canvas id=&quot;wb-drawing-canvas&quot; aria-label=&quot;Draw on the synthetic screen&quot;&gt;&lt;/canvas&gt;&#x27;:&quot;&quot;)+&#x27;&lt;span class=&quot;wb-screen-caption&quot;&gt;Sample screen&lt;/span&gt;&lt;/div&gt;&#x27;}
  function visual(persona){return&#x27;&lt;div class=&quot;wb-visual&quot;&gt;&#x27;+(persona?&#x27;&lt;div class=&quot;wb-persona-head&quot;&gt;&lt;/div&gt;&#x27;:&#x27;&lt;span class=&quot;wb-visual-label&quot;&gt;Soft mint&lt;/span&gt;&#x27;)+&quot;&lt;/div&gt;&quot;}
  function save(){
    state.collapsed=design.collapsed;state.roomy=design.roomy;
    const persisted=JSON.parse(JSON.stringify(state));
    persisted.sheet=null;
    persisted.strokes=persisted.strokes.slice(-3).map(function(s){return{pen:s.pen,points:s.points.slice(0,60)}});
    Object.keys(persisted.drafts).forEach(function(k){persisted.drafts[k]=persisted.drafts[k].slice(0,1800)});
    if(persisted.readingPending)persisted.readingPending={text:persisted.readingPending.text.slice(0,1800),origin:persisted.readingPending.origin.slice(0,100)};
    persisted.readingSaveName=persisted.readingSaveName.slice(0,100);
    persisted.dictionaryRules=persisted.dictionaryRules.slice(0,8).map(function(rule){return{heard:rule.heard.slice(0,80),written:rule.written.slice(0,80)}});
    persisted.dictionaryDraft={heard:persisted.dictionaryDraft.heard.slice(0,80),written:persisted.dictionaryDraft.written.slice(0,80)};
    persisted.history=persisted.history.slice(0,9).map(function(h){h.text=(h.text||&quot;&quot;).slice(0,1800);return h});
    const byteSize=function(value){return new TextEncoder().encode(JSON.stringify(value)).length};
    while(byteSize(persisted)&gt;12500&amp;&amp;persisted.history.length&gt;1)persisted.history.pop();
    if(byteSize(persisted)&gt;12500)persisted.strokes=[];
    if(byteSize(persisted)&gt;12500){

<script>(() => {
