name: Bug report
description: Help us reproduce something that is not working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping! Search existing issues first. Use synthetic examples; report vulnerabilities through Security, not here."
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…
2. Select…
3. Observe…"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Build details
      description: "Use Workbench → Copy build details. For an older version, include its name, version, macOS version and Mac chip."
      placeholder: "Workbench Preview, version and build, source revision, macOS"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshots, logs, or workaround
      description: Remove private text, recordings, clipboard contents, and file paths before posting.
