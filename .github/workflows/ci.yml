name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snap-talk-deck:
    name: Snap & Talk deck helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check portable PowerPoint helpers with synthetic sessions
        run: |
          python3 -m venv .deck-test
          .deck-test/bin/pip install -r Sources/LocalVoice/Resources/build-snap-and-talk-deck/packs/servicenow-employee-experience/1.0.0/requirements.txt
          .deck-test/bin/python scripts/test-snap-talk-deck.py
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify site contracts and release records
        run: node --test site/tests/*.test.mjs
      - name: Build the public website
        run: node site/build.mjs --require-production
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check development tools
        run: bash scripts/doctor.sh
      - name: Run regression checks
        run: bash scripts/test.sh
      - name: Render the production toolbar gallery
        run: swift run --disable-sandbox ToolbarGalleryRenderer test-results/toolbar
      - name: Retain toolbar visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolbar-native-gallery
          path: test-results/toolbar
          retention-days: 7
          if-no-files-found: error
      - name: Build and verify app package with native Shortcuts metadata
        env:
          REQUIRE_APP_INTENTS: "1"
        run: bash scripts/build.sh
      - name: Save tested app package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-tested-package
          path: dist/Workbench Preview.zip
          retention-days: 7
          if-no-files-found: error
